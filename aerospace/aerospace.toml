# AeroSpace: tiles the windows, starts SketchyBar and JankyBorders. Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# Every key is ctrl-alt (alt alone types { } [ ] | on an AZERTY Mac). AeroSpace binds physical
# keys named after QWERTY, so the keys below were picked to read the same on AZERTY and QWERTY.
# Karabiner (karabiner/karabiner.json) turns right command into ctrl-alt, so a new key here needs
# nothing there: right command-2 goes to workspace 2, right command-shift-2 sends there.
#
#   ctrl-alt-h/j/k/l or arrows        focus left/down/up/right
#   ctrl-alt-shift-h/j/k/l or arrows  move the window left/down/up/right
#   ctrl-alt-1..9                     go to workspace 1..9 of the focused display
#   ctrl-alt-shift-1..9               send the window to workspace 1..9 of the focused display (you
#                                     stay where you are)
#   ctrl-alt-tab                      back to the previous workspace
#   ctrl-alt-shift-tab                send the window to the next display, and follow it: then
#                                     ctrl-alt-shift-1..9 picks its workspace there
#   ctrl-alt-t                        tiles (again: horizontal <-> vertical)
#   ctrl-alt-s                        accordion, a stack (again: horizontal <-> vertical)
#   ctrl-alt-shift-space              floating <-> tiled
#   ctrl-alt-f                        fullscreen
#   ctrl-alt-enter                    new Ghostty window, in this workspace
#   ctrl-alt-minus / ctrl-alt-equal   shrink / grow: the two keys right of 0 (AZERTY: ")" and "-")
#   ctrl-alt-esc                      service mode, then: esc reload the config, r reset the layout,
#                                     f floating <-> tiled, backspace close the other windows,
#                                     ctrl-alt-shift-h/j/k/l join with the window on that side

config-version = 2

start-at-login = true
auto-reload-config = true

# exec-and-forget: started once, even when AeroSpace restarts. borders runs ~/.config/borders/bordersrc.
after-startup-command = ['exec-and-forget sketchybar', 'exec-and-forget borders']

# Tells the bar which workspace is focused (sketchybar/plugins/spaces.zsh)
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Closes the bar's Apple menu when another window is focused (sketchybar/sketchybarrc)
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_focus_change']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Every display has its own workspaces 1 to 9, named <set>-<n>: set 1 on the main display, 2 on the
# other, 3 on the built-in one when there are three (force assignment at the end). The keys pick
# the set of the focused display (workspace.zsh). Kept even when empty, so the bar always knows
# them; it only shows the ones in use.
persistent-workspaces = [
    '1-1', '1-2', '1-3', '1-4', '1-5', '1-6', '1-7', '1-8', '1-9',
    '2-1', '2-2', '2-3', '2-4', '2-5', '2-6', '2-7', '2-8', '2-9',
    '3-1', '3-2', '3-3', '3-4', '3-5', '3-6', '3-7', '3-8', '3-9',
]

key-mapping.preset = 'qwerty'

# 10 px around the windows. The top gap also leaves room for the bar: its height (32,
# sketchybar/sketchybarrc) + 10. A notched display already keeps that height free, even with the
# menu bar hidden: 10 there.
gaps.inner.horizontal = 13
gaps.inner.vertical =   13
gaps.outer.left =       10
gaps.outer.bottom =     10
gaps.outer.top =        [{ monitor.'built-in' = 10 }, 42]
gaps.outer.right =      10

# Ghostty tabs are macOS native tabs, which AeroSpace sees as windows of their own: without this
# rule a new tab lands in another workspace. https://ghostty.org/docs/help/macos-tiling-wms
[[on-window-detected]]
    if.app-id = 'com.mitchellh.ghostty'
    run = 'layout tiling'

[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

# An app that starts opens in the first empty workspace (new-app.zsh). Last, so the windows above
# stay where they open: Ghostty from ctrl-alt-enter, the floating ones.
[[on-window-detected]]
    if.during-aerospace-startup = false
    run = 'exec-and-forget ~/.config/aerospace/new-app.zsh'

[mode.main.binding]
    ctrl-alt-h = 'focus left'
    ctrl-alt-j = 'focus down'
    ctrl-alt-k = 'focus up'
    ctrl-alt-l = 'focus right'
    ctrl-alt-left = 'focus left'
    ctrl-alt-down = 'focus down'
    ctrl-alt-up = 'focus up'
    ctrl-alt-right = 'focus right'

    ctrl-alt-shift-h = 'move left'
    ctrl-alt-shift-j = 'move down'
    ctrl-alt-shift-k = 'move up'
    ctrl-alt-shift-l = 'move right'
    ctrl-alt-shift-left = 'move left'
    ctrl-alt-shift-down = 'move down'
    ctrl-alt-shift-up = 'move up'
    ctrl-alt-shift-right = 'move right'

    ctrl-alt-1 = 'exec-and-forget ~/.config/aerospace/workspace.zsh focus 1'
    ctrl-alt-2 = 'exec-and-forget ~/.config/aerospace/workspace.zsh focus 2'
    ctrl-alt-3 = 'exec-and-forget ~/.config/aerospace/workspace.zsh focus 3'
    ctrl-alt-4 = 'exec-and-forget ~/.config/aerospace/workspace.zsh focus 4'
    ctrl-alt-5 = 'exec-and-forget ~/.config/aerospace/workspace.zsh focus 5'
    ctrl-alt-6 = 'exec-and-forget ~/.config/aerospace/workspace.zsh focus 6'
    ctrl-alt-7 = 'exec-and-forget ~/.config/aerospace/workspace.zsh focus 7'
    ctrl-alt-8 = 'exec-and-forget ~/.config/aerospace/workspace.zsh focus 8'
    ctrl-alt-9 = 'exec-and-forget ~/.config/aerospace/workspace.zsh focus 9'

    ctrl-alt-shift-1 = 'exec-and-forget ~/.config/aerospace/workspace.zsh send 1'
    ctrl-alt-shift-2 = 'exec-and-forget ~/.config/aerospace/workspace.zsh send 2'
    ctrl-alt-shift-3 = 'exec-and-forget ~/.config/aerospace/workspace.zsh send 3'
    ctrl-alt-shift-4 = 'exec-and-forget ~/.config/aerospace/workspace.zsh send 4'
    ctrl-alt-shift-5 = 'exec-and-forget ~/.config/aerospace/workspace.zsh send 5'
    ctrl-alt-shift-6 = 'exec-and-forget ~/.config/aerospace/workspace.zsh send 6'
    ctrl-alt-shift-7 = 'exec-and-forget ~/.config/aerospace/workspace.zsh send 7'
    ctrl-alt-shift-8 = 'exec-and-forget ~/.config/aerospace/workspace.zsh send 8'
    ctrl-alt-shift-9 = 'exec-and-forget ~/.config/aerospace/workspace.zsh send 9'

    ctrl-alt-tab = 'workspace-back-and-forth'
    ctrl-alt-shift-tab = 'move-node-to-monitor --focus-follows-window --wrap-around next'

    ctrl-alt-t = 'layout tiles horizontal vertical'
    ctrl-alt-s = 'layout accordion horizontal vertical'
    ctrl-alt-shift-space = 'layout floating tiling'
    ctrl-alt-f = 'fullscreen'

    # A window, not a tab: AeroSpace sees a tab as a window and sends it to another workspace.
    # Ghostty not running: activate starts it with its first window.
    ctrl-alt-enter = '''exec-and-forget osascript -e 'if application "Ghostty" is running then tell application "Ghostty" to new window' -e 'tell application "Ghostty" to activate' '''

    ctrl-alt-minus = 'resize smart -50'
    ctrl-alt-equal = 'resize smart +50'

    ctrl-alt-esc = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    ctrl-alt-shift-h = ['join-with left', 'mode main']
    ctrl-alt-shift-j = ['join-with down', 'mode main']
    ctrl-alt-shift-k = ['join-with up', 'mode main']
    ctrl-alt-shift-l = ['join-with right', 'mode main']

# Each set on its display, by role, as read_sets in workspace.zsh: 'main' is the main display of
# System Settings > Displays, 'secondary' the other one when there are two. With three, set 2 goes
# to the first display from the left not named built-in, and set 3 to the built-in one. A set whose
# display is gone is parked on the main display; workspace.zsh reconcile moves its windows to empty
# workspaces, and back if the display returns within a grace period.
[workspace-to-monitor-force-assignment]
    1-1 = 'main'
    1-2 = 'main'
    1-3 = 'main'
    1-4 = 'main'
    1-5 = 'main'
    1-6 = 'main'
    1-7 = 'main'
    1-8 = 'main'
    1-9 = 'main'
    2-1 = ['secondary', '^(?!built-in)']
    2-2 = ['secondary', '^(?!built-in)']
    2-3 = ['secondary', '^(?!built-in)']
    2-4 = ['secondary', '^(?!built-in)']
    2-5 = ['secondary', '^(?!built-in)']
    2-6 = ['secondary', '^(?!built-in)']
    2-7 = ['secondary', '^(?!built-in)']
    2-8 = ['secondary', '^(?!built-in)']
    2-9 = ['secondary', '^(?!built-in)']
    3-1 = 'built-in'
    3-2 = 'built-in'
    3-3 = 'built-in'
    3-4 = 'built-in'
    3-5 = 'built-in'
    3-6 = 'built-in'
    3-7 = 'built-in'
    3-8 = 'built-in'
    3-9 = 'built-in'
