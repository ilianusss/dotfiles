# Colors come from ~/.theme (the theme command): theme/targets/superfile.zsh writes theme.toml
theme = 'theme'
editor = 'nvim'
auto_check_update = false
cd_on_quit = true
default_open_file_preview = true
show_image_preview = true
show_panel_footer_info = true
file_size_use_si = true
nerdfont = true
transparent_background = true
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'
ignore_missing_fields = true
